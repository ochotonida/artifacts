plugins {
    id 'base'
    id 'dev.architectury.loom' version '1.11-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.6' apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"

    base {
        archivesName = "$rootProject.archives_base_name-$project.name"
    }

    sourceSets {
        main.resources.srcDirs = ['src/main/resources', 'src/generated/resources']
    }

    repositories {
        maven {
            url "https://jitpack.io"
            content {
                includeGroupByRegex "com.github.*"
            }
        }
        maven {
            url "https://cursemaven.com"
            content {
                includeGroup "curse.maven"
            }
        }
        maven {
            url "https://api.modrinth.com/maven"
            content {
                includeGroup "maven.modrinth"
            }
        }
        maven {
            url "https://maven.theillusivec4.top/"
            content {
                includeGroupByRegex "top.theillusivec4.*"
            }
        }
        maven {
            url "https://maven.florens.be/releases"
            content {
                includeGroup "be.florens"
            }
        }
        maven {
            url "https://maven.shedaniel.me/"
            content {
                includeGroupByRegex "me.shedaniel.*"
            }
        }
        maven {
            url "https://maven.terraformersmc.com/"
            content {
                includeGroup "dev.emi"
                includeGroup "com.terraformersmc"
            }
        }
        maven {
            name "Cardinal Components"
            url "https://maven.ladysnake.org/releases"
            content {
                includeGroupByRegex "dev.onyxstudios.*"
            }
        }
    }

    if (project.name != 'data') {
        apply plugin: "dev.architectury.loom"

        loom {
            silentMojangMappingsLicense()
        }

        dependencies {
            minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
            mappings loom.officialMojangMappings()
        }
    }

    java {
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 17
    }
}

tasks.register('collectJars', Copy) {
    dependsOn subprojects.findAll { it.name != 'common' && it.name != 'data' }.collect { it.tasks.named('remapJar') }

    from(subprojects.findAll { it.name != 'common' && it.name != 'data'}.collect { it.tasks.named('remapJar').get().archiveFile })
    into(layout.buildDirectory.dir('libs'))
}

tasks.assemble.dependsOn(collectJars)
